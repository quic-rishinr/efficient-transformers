<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="500" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">QEFF timeline from 2024 to 2026</title>
  <desc id="desc">Timeline of major QEFF milestones from continuous batching in 2024 through sequence classification and Wan image-to-video support in 2026.</desc>
  <defs>
    <style>
      .title { font-family: Arial, sans-serif; font-size: 30px; font-weight: 700; fill: #0d1b2a; }
      .subtitle { font-family: Arial, sans-serif; font-size: 16px; font-weight: 500; fill: #415a77; }
      .year { font-family: Arial, sans-serif; font-size: 24px; font-weight: 700; fill: #0d1b2a; }
      .label { font-family: Arial, sans-serif; font-size: 16px; font-weight: 700; fill: #0d1b2a; }
      .body { font-family: Arial, sans-serif; font-size: 13px; font-weight: 500; fill: #3d546a; }
      .tag { font-family: Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #004a77; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#9bb6cc" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="1500" height="500" rx="28" fill="#f7fbff"/>
  <text x="70" y="72" class="title">Major Capability Milestones Since the 2024 Blog</text>
  <text x="70" y="102" class="subtitle">A compressed view of the additions that changed QEFF from a simpler transformer path into a broader deployment stack.</text>

  <text x="140" y="162" class="year">2024</text>
  <text x="700" y="162" class="year">2025</text>
  <text x="1290" y="162" class="year">2026</text>

  <line x1="110" y1="265" x2="1390" y2="265" stroke="#1f88d1" stroke-width="10" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <circle cx="220" cy="265" r="18" fill="#005fbd"/>
    <rect x="120" y="190" width="200" height="60" rx="18" fill="#ffffff"/>
    <text x="140" y="216" class="label">Continuous batching</text>
    <text x="140" y="236" class="body">The first big throughput-oriented shift.</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="350" cy="265" r="18" fill="#0077c8"/>
    <rect x="255" y="290" width="190" height="78" rx="18" fill="#ffffff"/>
    <text x="275" y="316" class="label">PEFT and AWQ/GPTQ</text>
    <text x="275" y="336" class="body">Adapters and quantized paths widened</text>
    <text x="275" y="354" class="body">the practical deployment envelope.</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="490" cy="265" r="18" fill="#008fda"/>
    <rect x="385" y="190" width="210" height="60" rx="18" fill="#ffffff"/>
    <text x="405" y="216" class="label">Finite LoRAX and QNN</text>
    <text x="405" y="236" class="body">Mixed adapters and deeper compile flows.</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="650" cy="265" r="18" fill="#00a0df"/>
    <rect x="545" y="290" width="210" height="78" rx="18" fill="#ffffff"/>
    <text x="565" y="316" class="label">VLM auto class</text>
    <text x="565" y="336" class="body">Image-text execution became a real</text>
    <text x="565" y="354" class="body">part of the public QEFF story.</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="800" cy="265" r="18" fill="#10a7d3"/>
    <rect x="705" y="190" width="190" height="60" rx="18" fill="#ffffff"/>
    <text x="725" y="216" class="label">Disagg + SpD + embeddings</text>
    <text x="725" y="236" class="body">Serving topology and speculation deepened.</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="980" cy="265" r="18" fill="#1eb2c0"/>
    <rect x="875" y="290" width="210" height="92" rx="18" fill="#ffffff"/>
    <text x="895" y="316" class="label">CCL and ONNX subfunctions</text>
    <text x="895" y="336" class="body">Long-context specialization and</text>
    <text x="895" y="354" class="body">modular export changed the economics</text>
    <text x="895" y="372" class="body">of large-model compilation.</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="1140" cy="265" r="18" fill="#2abbb0"/>
    <rect x="1035" y="190" width="210" height="78" rx="18" fill="#ffffff"/>
    <text x="1055" y="216" class="label">BlockedKV + Diffusers</text>
    <text x="1055" y="236" class="body">Runtime efficiency and modality breadth</text>
    <text x="1055" y="254" class="body">both accelerated late in 2025.</text>
  </g>

  <g filter="url(#shadow)">
    <circle cx="1275" cy="265" r="18" fill="#44c1a4"/>
    <rect x="1170" y="290" width="230" height="92" rx="18" fill="#ffffff"/>
    <text x="1190" y="316" class="label">Wan, sequence classification, I2V</text>
    <text x="1190" y="336" class="body">The 2026 repo keeps broadening:</text>
    <text x="1190" y="354" class="body">video pipelines, new task classes,</text>
    <text x="1190" y="372" class="body">and cleaner export paths continue.</text>
  </g>

  <rect x="110" y="414" width="1280" height="44" rx="16" fill="#ffffff" opacity="0.9"/>
  <text x="750" y="441" text-anchor="middle" class="body">The pattern is consistent: QEFF keeps adding capability at three layers simultaneously — modality coverage, runtime behavior, and deployment workflow maturity.</text>
</svg>
